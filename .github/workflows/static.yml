# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "app-20260626-recurring-bill-restore.js"
      - "backend.js"
      - "config.example.js"
      - "supabase-health.html"
      - "assets/**"
      - ".github/workflows/static.yml"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create production config
        run: |
          cat > config.js <<'EOF'
          window.WEAREFIT_CONFIG = {
            production: true,
            supabaseUrl: "${{ vars.SUPABASE_URL }}",
            supabasePublishableKey: "${{ vars.SUPABASE_PUBLISHABLE_KEY }}",
            appUrl: "https://fit-training.org/",
            emailDomain: "notifications.fit-training.org",
            accountDeletionEnabled: "${{ vars.ACCOUNT_DELETION_ENABLED }}" === "true",
            presenceEnabled: "${{ vars.PRESENCE_ENABLED }}" === "true",
          };
          EOF
      - name: Prepare static site artifact
        run: |
          mkdir -p public-site
          cp index.html styles.css app.js app-20260626-recurring-bill-restore.js backend.js config.js supabase-health.html public-site/
          cp -R assets public-site/assets
          printf 'fit-training.org\n' > public-site/CNAME
          touch public-site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
