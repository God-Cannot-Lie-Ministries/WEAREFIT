name: Keep Supabase awake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Verify public Supabase config
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repository variable" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY repository variable" && exit 1)

      - name: Ping Supabase Auth
        run: |
          curl --retry 3 --retry-delay 5 --show-error --silent \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --output /tmp/supabase-auth.json \
            --write-out "Auth status: %{http_code}\n" \
            "$SUPABASE_URL/auth/v1/settings"

      - name: Ping Supabase REST API
        run: |
          status="$(curl --retry 3 --retry-delay 5 --show-error --silent \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --output /tmp/supabase-rest.json \
            --write-out "%{http_code}" \
            "$SUPABASE_URL/rest/v1/portal_states?select=owner_email&limit=1")"
          echo "REST status: $status"
          case "$status" in
            200|204|401|403) exit 0 ;;
            *) echo "Supabase REST API did not respond as an active project."; exit 1 ;;
          esac
