<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEAREFIT Supabase Health</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071a35;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(680px, calc(100vw - 32px));
        border: 1px solid rgba(217, 166, 46, 0.55);
        border-radius: 18px;
        padding: 28px;
        background: rgba(14, 43, 82, 0.82);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 6vw, 3.5rem);
      }
      p {
        color: #c8d4e6;
        font-size: 1.05rem;
        line-height: 1.55;
      }
      code {
        overflow-wrap: anywhere;
        color: #f7c948;
      }
      .status {
        margin-top: 18px;
        padding: 16px;
        border-radius: 14px;
        background: rgba(7, 26, 53, 0.72);
      }
    </style>
  </head>
  <body>
    <main>
      <p>F.I.T. system check</p>
      <h1>Supabase connection</h1>
      <div class="status" id="status">Checking live configuration...</div>
    </main>
    <script src="config.js"></script>
    <script>
      const status = document.getElementById("status");
      const config = window.WEAREFIT_CONFIG || {};
      status.innerHTML = config.production && config.supabaseUrl
        ? `Production mode is active.<p>Project URL: <code>${config.supabaseUrl}</code></p><p>If sign in still fails, restore the paused project in Supabase Studio and wait for the project status to become Active.</p>`
        : "Production mode is not active. Check the GitHub Pages deployment variables.";
    </script>
  </body>
</html>
